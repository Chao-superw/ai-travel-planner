openapi: 3.0.3
info:
  title: 行者旅行规划 API
  version: 1.0.0
  description: 面向前端的 HTTP 契约。新注册须邮箱验证码，登录输入为 email/password；username 仅作展示兼容和旧账号迁移入口输入。所有受保护业务均要求邮箱验证；me、logout、邮箱绑定流程除外。金额单位为分，地点坐标为 GCJ-02。异步任务排队与领取后执行各最多 300 秒；模型单次非流式 HTTP 请求最多 120 秒。
servers:
  - url: http://127.0.0.1:8080
tags:
  - {name: System}
  - {name: Auth}
  - {name: Places}
  - {name: Jobs}
  - {name: Trips}
paths:
  /healthz:
    get:
      tags: [System]
      summary: 进程存活检查
      responses: {'200': {description: 进程存活, content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}}}
  /readyz:
    get:
      tags: [System]
      summary: Travel RPC 就绪检查
      responses:
        '200': {$ref: '#/components/responses/Ready'}
        '503': {$ref: '#/components/responses/Error'}
        '504': {$ref: '#/components/responses/Error'}
  /openapi.yaml:
    get:
      tags: [System]
      summary: 下载本契约
      responses:
        '200': {description: OpenAPI YAML, content: {application/yaml: {schema: {type: string}}}}
        '404': {description: 文件未配置或不存在}
  /api/v1/auth/register/code:
    post:
      tags: [Auth]
      summary: 发送注册邮箱验证码
      description: 同邮箱默认冷却 60 秒；只返回 challenge 元数据，不返回验证码。已注册邮箱同样走发送流程，200 不表示邮箱尚未注册。成功发送的新码替代旧码；失败保留先前仍有效的码。SMTP 不自动重试，超时送达的本次码可能不可用。
      requestBody: {$ref: '#/components/requestBodies/EmailCode'}
      responses:
        '200': {$ref: '#/components/responses/AuthChallenge'}
        '400': {$ref: '#/components/responses/InvalidAuthInput'}
        '429': {$ref: '#/components/responses/AuthRateLimited'}
        '503': {$ref: '#/components/responses/MailUnavailable'}
        '504': {$ref: '#/components/responses/AuthTimeout'}
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: 验证邮箱并注册普通用户
      description: 成功返回 User，不自动登录；随后调用邮箱密码登录。有效验证码最多使用一次；重复邮箱返回 EMAIL_ALREADY_REGISTERED 并消费证明，绝不覆盖已有密码。旧 username/password 请求体不再接受。
      requestBody: {$ref: '#/components/requestBodies/Registration'}
      responses:
        '201': {$ref: '#/components/responses/RegisteredUser'}
        '400': {$ref: '#/components/responses/VerificationInputError'}
        '409': {$ref: '#/components/responses/EmailConflict'}
        '429': {$ref: '#/components/responses/AuthRateLimited'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}
        '504': {$ref: '#/components/responses/AuthTimeout'}
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: 邮箱密码登录
      description: 无需再次发送验证码。账号不存在、邮箱格式错误或密码错误均返回 INVALID_CREDENTIALS；只接受已验证邮箱账号。旧 username/password 请求体不再接受。
      requestBody: {$ref: '#/components/requestBodies/EmailLogin'}
      responses:
        '200': {$ref: '#/components/responses/AuthSession'}
        '400': {$ref: '#/components/responses/InvalidAuthInput'}
        '401': {$ref: '#/components/responses/InvalidCredentials'}
        '429': {$ref: '#/components/responses/AuthRateLimited'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}
        '504': {$ref: '#/components/responses/AuthTimeout'}
  /api/v1/auth/legacy/login:
    post:
      tags: [Auth]
      summary: 旧用户名账号迁移登录
      description: 仅尚未绑定邮箱的既有账号可用。得到的会话只可查询 me、注销、请求绑定验证码和绑定邮箱；业务请求返回 EMAIL_VERIFICATION_REQUIRED。绑定后此登录入口失效，改用邮箱和原密码。
      requestBody: {$ref: '#/components/requestBodies/LegacyLogin'}
      responses:
        '200': {$ref: '#/components/responses/AuthSession'}
        '400': {$ref: '#/components/responses/InvalidAuthInput'}
        '401': {$ref: '#/components/responses/InvalidCredentials'}
        '429': {$ref: '#/components/responses/AuthRateLimited'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}
        '504': {$ref: '#/components/responses/AuthTimeout'}
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: 注销当前会话
      description: 未绑定邮箱的旧账号也可注销；会话立即撤销。
      security: [{bearerAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/AuthLogout'}
        '401': {$ref: '#/components/responses/AuthSessionRequired'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}
        '504': {$ref: '#/components/responses/AuthTimeout'}
  /api/v1/me:
    get:
      tags: [Auth]
      summary: 当前用户
      description: 未绑定邮箱的旧账号也可查询；前端据 email_verified 决定是否进入绑定页。
      security: [{bearerAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/AuthUser'}
        '401': {$ref: '#/components/responses/AuthSessionRequired'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}
        '504': {$ref: '#/components/responses/AuthTimeout'}
  /api/v1/me/email/code:
    post:
      tags: [Auth]
      summary: 为当前旧账号发送邮箱绑定验证码
      description: 只允许未绑定邮箱的当前账号。验证码用途及用户 ID 固定为本次绑定，不能代替注册码或其他账号的绑定码。与注册共享发码冷却和限额。
      security: [{bearerAuth: []}]
      requestBody: {$ref: '#/components/requestBodies/EmailCode'}
      responses:
        '200': {$ref: '#/components/responses/AuthChallenge'}
        '400': {$ref: '#/components/responses/InvalidAuthInput'}
        '401': {$ref: '#/components/responses/AuthSessionRequired'}
        '409': {$ref: '#/components/responses/EmailAlreadyBound'}
        '429': {$ref: '#/components/responses/AuthRateLimited'}
        '503': {$ref: '#/components/responses/MailUnavailable'}
        '504': {$ref: '#/components/responses/AuthTimeout'}
  /api/v1/me/email:
    post:
      tags: [Auth]
      summary: 验证并绑定旧账号邮箱
      description: 保留原 ID、密码、角色、会话和行程；成功后可访问业务接口。已绑定账号不支持换绑。
      security: [{bearerAuth: []}]
      requestBody: {$ref: '#/components/requestBodies/EmailBinding'}
      responses:
        '200': {$ref: '#/components/responses/AuthUser'}
        '400': {$ref: '#/components/responses/VerificationInputError'}
        '401': {$ref: '#/components/responses/AuthSessionRequired'}
        '409': {$ref: '#/components/responses/EmailConflict'}
        '429': {$ref: '#/components/responses/AuthRateLimited'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}
        '504': {$ref: '#/components/responses/AuthTimeout'}
  /api/v1/places:
    get:
      tags: [Places]
      summary: 搜索并保存候选地点快照
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: city, required: true, schema: {type: string, maxLength: 40}, example: 杭州市}
        - {in: query, name: keyword, required: false, schema: {type: string, maxLength: 80}, example: 博物馆}
        - {$ref: '#/components/parameters/Page'}
        - {in: query, name: page_size, schema: {type: integer, format: int32, minimum: 1, maximum: 25, default: 20}}
      responses:
        '200': {description: 候选地点页, content: {application/json: {schema: {$ref: '#/components/schemas/PlacesEnvelope'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/EmailVerificationRequired'}
        '503': {$ref: '#/components/responses/Error'}
        '504': {$ref: '#/components/responses/Error'}
  /api/v1/admin/places:
    post:
      tags: [Places]
      summary: 用搜索所得 ID 建立地点资料
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreatePlaceInput'}}}}
      responses:
        '200': {description: 地点资料, content: {application/json: {schema: {$ref: '#/components/schemas/PlaceEnvelope'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/ProtectedAccessDenied'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/admin/places/{id}:
    patch:
      tags: [Places]
      summary: 完整替换地点的可编辑资料
      description: 路径 ID 为准。所有可编辑字段按替换语义处理；未知费用或营业时间传 null。不得发送供应商身份、名称或坐标。
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdatePlaceInput'}}}}
      responses:
        '200': {description: 更新后地点, content: {application/json: {schema: {$ref: '#/components/schemas/PlaceEnvelope'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/ProtectedAccessDenied'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/planning-jobs:
    post:
      tags: [Jobs]
      summary: 创建行程规划任务
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreatePlanningJobInput'}}}}
      responses:
        '202': {$ref: '#/components/responses/AcceptedJob'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/EmailVerificationRequired'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /api/v1/planning-jobs/{id}:
    get:
      tags: [Jobs]
      summary: 查询任务
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses:
        '200': {description: 任务（异步失败也返回 200，错误位于 data.error）, content: {application/json: {schema: {$ref: '#/components/schemas/JobEnvelope'}}}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/EmailVerificationRequired'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/planning-jobs/{id}/retries:
    post:
      tags: [Jobs]
      summary: 重试失败或中断的任务
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '202': {$ref: '#/components/responses/AcceptedJob'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/EmailVerificationRequired'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /api/v1/trips:
    get:
      tags: [Trips]
      summary: 查询行程摘要列表
      description: 列表不返回 activities 与 routes。
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses:
        '200': {description: 行程摘要页, content: {application/json: {schema: {$ref: '#/components/schemas/TripSummariesEnvelope'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/EmailVerificationRequired'}
  /api/v1/trips/{id}:
    get:
      tags: [Trips]
      summary: 查询行程当前版本
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses:
        '200': {description: 完整行程, content: {application/json: {schema: {$ref: '#/components/schemas/TripEnvelope'}}}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/EmailVerificationRequired'}
        '404': {$ref: '#/components/responses/Error'}
    patch:
      tags: [Trips]
      summary: 创建手动修改任务
      description: 只接受活动可编辑字段；服务端重算费用、地点快照和路线。该任务 kind=manual_edit，不调用模型。
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateTripInput'}}}}
      responses:
        '202': {$ref: '#/components/responses/AcceptedJob'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/EmailVerificationRequired'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /api/v1/trips/{id}/replanning-jobs:
    post:
      tags: [Trips, Jobs]
      summary: 创建局部重规划任务
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReplanningInput'}}}}
      responses:
        '202': {$ref: '#/components/responses/AcceptedJob'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/EmailVerificationRequired'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /api/v1/trips/{id}/versions:
    get:
      tags: [Trips]
      summary: 查询不可变版本摘要
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses:
        '200': {description: 版本摘要页, content: {application/json: {schema: {$ref: '#/components/schemas/TripSummariesEnvelope'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/EmailVerificationRequired'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/trips/{id}/versions/{version}:
    get:
      tags: [Trips]
      summary: 查询指定历史版本
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - {in: path, name: version, required: true, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        '200': {description: 完整历史行程, content: {application/json: {schema: {$ref: '#/components/schemas/TripEnvelope'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/EmailVerificationRequired'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/trips/{id}/budget:
    get:
      tags: [Trips]
      summary: 查询当前版本预算汇总
      description: known_total_cents 只累计已知金额；complete=false 时 within_budget 省略。
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses:
        '200': {description: 预算汇总, content: {application/json: {schema: {$ref: '#/components/schemas/BudgetEnvelope'}}}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/EmailVerificationRequired'}
        '404': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, description: 8 小时随机服务端会话；已验证邮箱可访问业务，未绑定旧账号仅可 me/logout/绑定。}
  parameters:
    ID: {in: path, name: id, required: true, schema: {type: string, minLength: 1}, example: trip-id}
    Page: {in: query, name: page, schema: {type: integer, format: int32, minimum: 1, maximum: 10000, default: 1}}
    PageSize: {in: query, name: page_size, schema: {type: integer, format: int32, minimum: 1, maximum: 100, default: 20}}
    IdempotencyKey: {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 1, maxLength: 128}, example: request-key-1}
  headers:
    NoStore: {description: 认证及当前用户接口的所有响应均禁止缓存, schema: {type: string, enum: [no-store]}}
    RetryAfter: {description: 认证限流后需等待的秒数，与正文 retry_after 一致；CORS 允许读取, schema: {type: integer, format: int32, minimum: 1}, example: 60}
  requestBodies:
    EmailCode:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/EmailCodeInput'}}}
    Registration:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/RegistrationInput'}}}
    EmailLogin:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/EmailLoginInput'}}}
    LegacyLogin:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/LegacyLoginInput'}}}
    EmailBinding:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/EmailBindingInput'}}}
  responses:
    Error: {description: "同步错误：400 参数，401 认证，403 邮箱未验证/权限，404 不存在/不可见，409 冲突，422 约束，429 配额，503 依赖不可用，504 同步超时", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    AuthChallenge:
      description: 邮件发送成功；默认 600 秒有效、60 秒重发间隔，以返回剩余秒数为准
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/ChallengeEnvelope'}}}
    RegisteredUser:
      description: 已创建已验证邮箱的普通用户；未自动登录
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/UserEnvelope'}}}
    AuthUser:
      description: 当前用户或绑定后的用户
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/UserEnvelope'}}}
    AuthSession:
      description: 登录成功；token 为 8 小时服务端会话
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/SessionEnvelope'}}}
    AuthLogout:
      description: 当前会话已撤销
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/LogoutEnvelope'}}}
    InvalidAuthInput:
      description: INVALID_INPUT：请求格式、邮箱或字段不合法，含未知字段
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    VerificationInputError:
      description: INVALID_INPUT 或 INVALID_VERIFICATION_CODE；后者统一表示错误、过期、重放、用途或账号不匹配、次数耗尽
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    InvalidCredentials:
      description: INVALID_CREDENTIALS：邮箱或旧用户名账号及密码错误的统一响应；未绑定或已绑定入口不符也返回此码
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    AuthSessionRequired:
      description: UNAUTHORIZED / UNAUTHENTICATED：Bearer 缺失、无效、过期或撤销
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    EmailConflict:
      description: EMAIL_ALREADY_REGISTERED：有效证明对应邮箱已注册，证明被消费且密码不变；绑定接口也可能返回 EMAIL_ALREADY_BOUND
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    EmailAlreadyBound:
      description: EMAIL_ALREADY_BOUND：当前账号已绑定邮箱，不支持换绑
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    AuthUnavailable:
      description: AUTH_UNAVAILABLE / DATABASE_UNAVAILABLE / DEPENDENCY_UNAVAILABLE / RPC_UNAVAILABLE：认证配置、数据库或 RPC 暂不可用
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    MailUnavailable:
      description: MAIL_UNAVAILABLE：邮件发送失败或超时；也可能返回 AUTH_UNAVAILABLE / DATABASE_UNAVAILABLE / DEPENDENCY_UNAVAILABLE。不得自动重发
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    AuthTimeout:
      description: TIMEOUT：同步调用超时，结果可能尚未确认
      headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    AuthRateLimited:
      description: AUTH_RATE_LIMITED：发码冷却或邮箱/账号、TCP 对端 IP、全局限额触发；按 retry_after 等待
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AuthRateLimitError'}
          example: {code: AUTH_RATE_LIMITED, message: 请求过于频繁，请稍后重试, request_id: request-id, retry_after: 60}
    EmailVerificationRequired:
      description: EMAIL_VERIFICATION_REQUIRED：有效旧账号会话尚未验证邮箱，保留 token 并进入绑定流程
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    ProtectedAccessDenied:
      description: EMAIL_VERIFICATION_REQUIRED 或权限不足；管理员业务同时要求邮箱验证和 admin 角色
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    AcceptedJob: {description: 已接受异步任务；排队最多 300 秒，领取后执行最多 300 秒, content: {application/json: {schema: {$ref: '#/components/schemas/AcceptedJobEnvelope'}}}}
    Ready: {description: Travel RPC 可用, content: {application/json: {schema: {$ref: '#/components/schemas/ReadyEnvelope'}}}}
  schemas:
    EmailAddress:
      type: string
      description: ASCII 单一邮箱地址；去首尾空白并只小写域名，保留本地部分大小写、点号与别名。规范化后最多 254 字节，本地部分最多 64 字节；拒绝显示名、控制字符、多地址、单标签域名。
      example: Traveler+trip@example.com
    Password:
      type: string
      format: password
      description: 8–72 UTF-8 字节（不是字符数），bcrypt 不截断。前端用 TextEncoder 计数字节；OpenAPI 字符长度不能完整表达此规则。
      minLength: 1
      maxLength: 72
      x-min-utf8-bytes: 8
      x-max-utf8-bytes: 72
    VerificationCode: {type: string, pattern: '^[0-9]{6}$', minLength: 6, maxLength: 6, description: 邮件中的 6 位验证码；使用字符串保留前导零, example: '012345'}
    ChallengeID: {type: string, minLength: 1, maxLength: 128, description: 必须是对应发码响应的 challenge_id, example: challenge-id}
    EmailCodeInput:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: {$ref: '#/components/schemas/EmailAddress'}
    RegistrationInput:
      type: object
      additionalProperties: false
      required: [email, password, code, challenge_id]
      properties:
        email: {$ref: '#/components/schemas/EmailAddress'}
        password: {$ref: '#/components/schemas/Password'}
        code: {$ref: '#/components/schemas/VerificationCode'}
        challenge_id: {$ref: '#/components/schemas/ChallengeID'}
    EmailLoginInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {$ref: '#/components/schemas/EmailAddress'}
        password: {$ref: '#/components/schemas/Password'}
    LegacyLoginInput:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {type: string, minLength: 1, maxLength: 128, description: 既有且未绑定邮箱的用户名；1–128 UTF-8 字节}
        password: {$ref: '#/components/schemas/Password'}
    EmailBindingInput:
      type: object
      additionalProperties: false
      required: [email, code, challenge_id]
      properties:
        email: {$ref: '#/components/schemas/EmailAddress'}
        code: {$ref: '#/components/schemas/VerificationCode'}
        challenge_id: {$ref: '#/components/schemas/ChallengeID'}
    EmailChallenge:
      type: object
      additionalProperties: false
      required: [challenge_id, expires_in, retry_after]
      description: 仅返回发送后的元数据，绝不包含验证码。成功重发替代同邮箱旧码；注册与绑定用途不可互换。
      properties:
        challenge_id: {$ref: '#/components/schemas/ChallengeID'}
        expires_in: {type: integer, format: int32, minimum: 1, description: 剩余有效秒数；默认 TTL 为 600 秒，发送会消耗其中一部分, example: 598}
        retry_after: {type: integer, format: int32, minimum: 1, description: 重发等待秒数，默认 60 秒, example: 60}
    User:
      type: object
      required: [id, username, role, email, email_verified]
      properties:
        id: {type: string}
        username: {type: string, description: 兼容展示名；新用户由服务端生成，不是邮箱登录输入}
        role: {type: string, enum: [user, admin]}
        email: {type: string, description: 已绑定的规范化邮箱；未绑定旧账号为空字符串, example: Traveler+trip@example.com}
        email_verified: {type: boolean, description: 为 false 时仅可访问当前用户、注销和绑定接口}
    Session: {type: object, required: [token, expires_at, user], properties: {token: {type: string}, expires_at: {type: string, format: date-time, description: 登录后 8 小时过期}, user: {$ref: '#/components/schemas/User'}}}
    Constraints:
      type: object
      required: [city, start_date, end_date, party_size, budget_cents, budget_scope, interests, pace, transport]
      properties:
        city: {type: string, example: 杭州市}
        start_date: {type: string, format: date, example: '2026-10-01'}
        end_date: {type: string, format: date, example: '2026-10-03'}
        party_size: {type: integer, format: int32, example: 2}
        budget_cents: {type: integer, format: int64, example: 200000}
        budget_scope: {type: string, enum: [per_person, total], example: per_person}
        budget_total_cents: {type: integer, format: int64, readOnly: true, description: 服务端计算的全团预算}
        interests: {type: array, items: {type: string}, example: [文化, 美食]}
        pace: {type: string, example: balanced}
        transport: {type: string, enum: [walking, transit], description: "偏好。transit 为公交优先；公交明确无方案时才接受实查且不超过 1500 米、1500 秒的短步行，并返回告警。", example: transit}
    ConstraintsInput:
      type: object
      additionalProperties: false
      required: [city, start_date, end_date, party_size, budget_cents, budget_scope, interests, pace, transport]
      properties:
        city: {type: string, example: 杭州市}
        start_date: {type: string, format: date, example: '2026-10-01'}
        end_date: {type: string, format: date, example: '2026-10-03'}
        party_size: {type: integer, format: int32, example: 2}
        budget_cents: {type: integer, format: int64, example: 200000}
        budget_scope: {type: string, enum: [per_person, total], example: per_person}
        interests: {type: array, items: {type: string}, example: [文化, 美食]}
        pace: {type: string, example: balanced}
        transport: {type: string, enum: [walking, transit], description: "偏好。transit 为公交优先；公交明确无方案时才接受实查且不超过 1500 米、1500 秒的短步行，并返回告警。", example: transit}
    Place:
      type: object
      properties:
        id: {type: string}
        provider: {type: string}
        provider_poi_id: {type: string}
        name: {type: string}
        city: {type: string}
        city_code: {type: string}
        ad_code: {type: string}
        location: {type: string, description: GCJ-02 经度,纬度}
        coordinate_system: {type: string, enum: [GCJ-02]}
        address: {type: string}
        type_code: {type: string}
        tags: {type: array, items: {type: string}}
        duration_minutes: {type: integer, format: int32}
        open_minute: {type: integer, format: int32, nullable: true}
        close_minute: {type: integer, format: int32, nullable: true}
        fee_cents: {type: integer, format: int64, nullable: true}
        fee_source: {type: string}
        active: {type: boolean}
        fetched_at: {type: string, format: date-time}
        version: {type: integer, format: int64}
    CreatePlaceInput:
      type: object
      additionalProperties: false
      required: [id, duration_minutes, tags, active]
      properties:
        id: {type: string, description: 之前搜索返回的地点 ID}
        duration_minutes: {type: integer, format: int32, minimum: 15, maximum: 480}
        tags: {type: array, maxItems: 10, items: {type: string}}
        open_minute: {type: integer, nullable: true, minimum: 0, maximum: 1439}
        close_minute: {type: integer, nullable: true, minimum: 1, maximum: 1440}
        fee_cents: {type: integer, format: int64, nullable: true, minimum: 0}
        fee_source: {type: string, maxLength: 500}
        active: {type: boolean}
    UpdatePlaceInput:
      type: object
      additionalProperties: false
      required: [duration_minutes, tags, open_minute, close_minute, fee_cents, fee_source, active, version]
      properties:
        duration_minutes: {type: integer, format: int32, minimum: 15, maximum: 480}
        tags: {type: array, maxItems: 10, items: {type: string}}
        open_minute: {type: integer, nullable: true, minimum: 0, maximum: 1439}
        close_minute: {type: integer, nullable: true, minimum: 1, maximum: 1440}
        fee_cents: {type: integer, format: int64, nullable: true, minimum: 0}
        fee_source: {type: string, maxLength: 500}
        active: {type: boolean}
        version: {type: integer, format: int64, minimum: 1}
    CreatePlanningJobInput:
      type: object
      additionalProperties: false
      required: [constraints]
      properties: {constraints: {$ref: '#/components/schemas/ConstraintsInput'}}
    Cost: {type: object, properties: {category: {type: string}, amount_cents: {type: integer, format: int64, nullable: true}, unit: {type: string}, source: {type: string}, estimated: {type: boolean}}}
    Activity:
      type: object
      properties:
        id: {type: string}
        date: {type: string, format: date}
        start_minute: {type: integer, format: int32}
        end_minute: {type: integer, format: int32}
        kind: {type: string}
        place_id: {type: string}
        title: {type: string}
        reason: {type: string}
        place: {$ref: '#/components/schemas/Place'}
        costs: {type: array, items: {$ref: '#/components/schemas/Cost'}}
    ActivityInput:
      type: object
      additionalProperties: false
      required: [id, date, start_minute, end_minute, kind, place_id, title, reason]
      properties: {id: {type: string}, date: {type: string, format: date}, start_minute: {type: integer, format: int32}, end_minute: {type: integer, format: int32}, kind: {type: string}, place_id: {type: string}, title: {type: string}, reason: {type: string}}
    Route: {type: object, properties: {from_item_id: {type: string}, to_item_id: {type: string}, date: {type: string, format: date}, mode: {type: string, enum: [walking, transit], description: "该路段实际采用的方式；即使请求偏好为 transit，公交无方案后的合规短步行也会返回 walking。"}, distance_m: {type: integer, format: int64}, duration_s: {type: integer, format: int64}, fee_cents: {type: integer, format: int64, nullable: true}, provider: {type: string}, queried_at: {type: string, format: date-time}, summary: {type: string}, polyline: {type: string}, from_location: {type: string}, to_location: {type: string}}}
    Plan: {type: object, required: [title, summary, activities, routes, warnings], properties: {title: {type: string}, summary: {type: string}, activities: {type: array, items: {$ref: '#/components/schemas/Activity'}}, routes: {type: array, items: {$ref: '#/components/schemas/Route'}}, warnings: {type: array, items: {type: string}}}}
    PlanInput:
      type: object
      additionalProperties: false
      required: [title, summary, activities]
      properties: {title: {type: string}, summary: {type: string}, activities: {type: array, items: {$ref: '#/components/schemas/ActivityInput'}}}
    UpdateTripInput:
      type: object
      additionalProperties: false
      required: [expected_version, plan]
      properties: {expected_version: {type: integer, format: int64, minimum: 1}, plan: {$ref: '#/components/schemas/PlanInput'}}
    ScopeInput:
      type: object
      additionalProperties: false
      required: [date, start_minute, end_minute, editable_item_ids, locked_item_ids]
      properties: {date: {type: string, format: date}, start_minute: {type: integer, format: int32}, end_minute: {type: integer, format: int32}, editable_item_ids: {type: array, items: {type: string}}, locked_item_ids: {type: array, items: {type: string}}}
    ReplanningInput:
      type: object
      additionalProperties: false
      required: [expected_version, scope, instruction]
      properties: {expected_version: {type: integer, format: int64, minimum: 1}, scope: {$ref: '#/components/schemas/ScopeInput'}, instruction: {type: string, minLength: 1, maxLength: 2000}}
    APIError: {type: object, required: [code, message, status], description: 异步任务内嵌的执行错误；不同于顶层 HTTP Error，该对象包含 status。, properties: {code: {type: string}, message: {type: string}, status: {type: integer, format: int32, minimum: 400, maximum: 599}, field_errors: {type: object, additionalProperties: {type: string}}}}
    ModelRun: {type: object, properties: {provider_request_id: {type: string}, returned_model: {type: string}, prompt_version: {type: string}, duration_ms: {type: integer, format: int64}, prompt_tokens: {type: integer, format: int64, nullable: true}, completion_tokens: {type: integer, format: int64, nullable: true}, finish_reason: {type: string}}}
    Job:
      type: object
      required: [id, kind, status, stage, created_at, updated_at]
      properties:
        id: {type: string}
        kind: {type: string, enum: [generate, replan, manual_edit]}
        status: {type: string, enum: [queued, running, succeeded, failed, conflicted, interrupted]}
        stage: {type: string}
        trip_id: {type: string}
        result_version: {type: integer, format: int64}
        parent_job_id: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        error: {$ref: '#/components/schemas/APIError'}
        model_runs: {type: array, items: {$ref: '#/components/schemas/ModelRun'}}
    AcceptedJob: {allOf: [{$ref: '#/components/schemas/Job'}, {type: object, required: [status_url], properties: {status_url: {type: string, example: /api/v1/planning-jobs/job-id}}}]}
    Trip: {type: object, required: [id, version, constraints, plan, created_at], properties: {id: {type: string}, version: {type: integer, format: int64}, constraints: {$ref: '#/components/schemas/Constraints'}, plan: {$ref: '#/components/schemas/Plan'}, created_at: {type: string, format: date-time}}}
    TripSummary: {type: object, required: [id, version, constraints, title, summary, created_at], properties: {id: {type: string}, version: {type: integer, format: int64}, constraints: {$ref: '#/components/schemas/Constraints'}, title: {type: string}, summary: {type: string}, created_at: {type: string, format: date-time}}}
    AmountGroup: {type: object, required: [key, known_cents, unknown_count], properties: {key: {type: string}, known_cents: {type: integer, format: int64}, unknown_count: {type: integer, format: int32}}}
    BudgetSummary: {type: object, required: [trip_id, version, budget_total_cents, known_total_cents, unknown_count, complete, by_day, by_category], properties: {trip_id: {type: string}, version: {type: integer, format: int64}, budget_total_cents: {type: integer, format: int64}, known_total_cents: {type: integer, format: int64}, unknown_count: {type: integer, format: int32}, complete: {type: boolean}, within_budget: {type: boolean, nullable: true}, by_day: {type: array, items: {$ref: '#/components/schemas/AmountGroup'}}, by_category: {type: array, items: {$ref: '#/components/schemas/AmountGroup'}}}}
    Error: {type: object, required: [code, message, request_id], description: 同步 HTTP 错误；HTTP 状态由响应状态码表达，对象中不包含 status。, properties: {code: {type: string}, message: {type: string}, request_id: {type: string}, field_errors: {type: object, additionalProperties: {type: string}}, retry_after: {type: integer, format: int32, minimum: 1, description: 认证限流的等待秒数}}}
    AuthRateLimitError: {allOf: [{$ref: '#/components/schemas/Error'}, {type: object, required: [retry_after], properties: {code: {type: string, enum: [AUTH_RATE_LIMITED]}}}]}
    ChallengeEnvelope: {type: object, required: [data, request_id], properties: {data: {$ref: '#/components/schemas/EmailChallenge'}, request_id: {type: string}}}
    Health: {type: object, required: [status], properties: {status: {type: string, enum: [ok]}}}
    ReadyEnvelope: {type: object, required: [data, request_id], properties: {data: {type: object, properties: {status: {type: string, enum: [ready]}}}, request_id: {type: string}}}
    UserEnvelope: {type: object, required: [data, request_id], properties: {data: {$ref: '#/components/schemas/User'}, request_id: {type: string}}}
    SessionEnvelope: {type: object, required: [data, request_id], properties: {data: {$ref: '#/components/schemas/Session'}, request_id: {type: string}}}
    LogoutEnvelope: {type: object, required: [data, request_id], properties: {data: {type: object, required: [logged_out], properties: {logged_out: {type: boolean}}}, request_id: {type: string}}}
    PlaceEnvelope: {type: object, required: [data, request_id], properties: {data: {$ref: '#/components/schemas/Place'}, request_id: {type: string}}}
    PlacesEnvelope: {type: object, required: [data, request_id], properties: {data: {type: object, required: [items, page, page_size, has_more], properties: {items: {type: array, items: {$ref: '#/components/schemas/Place'}}, page: {type: integer}, page_size: {type: integer}, has_more: {type: boolean}}}, request_id: {type: string}}}
    JobEnvelope: {type: object, required: [data, request_id], properties: {data: {$ref: '#/components/schemas/Job'}, request_id: {type: string}}}
    AcceptedJobEnvelope: {type: object, required: [data, request_id], properties: {data: {$ref: '#/components/schemas/AcceptedJob'}, request_id: {type: string}}}
    TripEnvelope: {type: object, required: [data, request_id], properties: {data: {$ref: '#/components/schemas/Trip'}, request_id: {type: string}}}
    TripSummariesEnvelope: {type: object, required: [data, request_id], properties: {data: {type: object, required: [items, page, page_size, has_more], properties: {items: {type: array, items: {$ref: '#/components/schemas/TripSummary'}}, page: {type: integer}, page_size: {type: integer}, has_more: {type: boolean}}}, request_id: {type: string}}}
    BudgetEnvelope: {type: object, required: [data, request_id], properties: {data: {$ref: '#/components/schemas/BudgetSummary'}, request_id: {type: string}}}
